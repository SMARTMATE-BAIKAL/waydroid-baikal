# Maintainer: Timofei Granovskii <t.stifix@gmail.com>
[Unit]
Before=display-manager.service

[Service]
# The daemon prepares Binder and static image mounts before graphics login.
Type=notify
NotifyAccess=main
TimeoutStartSec=30s
Restart=on-failure
RestartSec=2s
# Android manages its own subgroups; systemd owns the service boundary.
Delegate=cpu cpuset io memory pids
DelegateSubgroup=init.scope
TasksMax=32768
CPUWeight=100
IOWeight=100
StartupCPUWeight=100
StartupIOWeight=100
